<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ボーリング対戦">
    <title>賭けボーリング対戦アプリ</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 40px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .settings {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .setting-row:last-child {
            margin-bottom: 0;
        }

        label {
            font-weight: 600;
            color: #333;
        }

        input[type="number"] {
            width: 100px;
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .team {
            background: #fff;
            border: 3px solid #667eea;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .team-name {
            font-size: 20px;
            font-weight: bold;
            padding: 8px 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            background: white;
            min-width: 150px;
        }

        .team-controls button {
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-left: 10px;
        }

        .add-player-btn {
            background: #28a745;
            color: white;
        }

        .remove-team-btn {
            background: #dc3545;
            color: white;
        }

        .player {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .player input {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .player-name {
            flex: 1;
        }

        .player-score {
            width: 100px;
        }

        .remove-player-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .add-team-btn {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .team-selector {
            background: #fff3cd;
            border: 3px solid #ffc107;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .team-selector h3 {
            margin-bottom: 15px;
            color: #856404;
        }

        .team-select-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .team-select-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .team-select-btn.selected {
            background: #667eea;
            color: white;
        }

        .calculate-btn {
            width: 100%;
            padding: 18px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .calculate-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .results {
            background: #e8f5e9;
            border: 3px solid #28a745;
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
        }

        .result-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .result-header h2 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .score-diff {
            font-size: 24px;
            font-weight: bold;
            color: #1b5e20;
        }

        .result-team {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .result-team h3 {
            margin-bottom: 15px;
            color: #667eea;
        }

        .result-player {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .result-player.winner {
            background: #d4edda;
        }

        .result-player.loser {
            background: #f8d7da;
        }

        .player-result-name {
            font-weight: 600;
        }

        .player-result-points {
            font-weight: bold;
        }

        .player-result-points.positive {
            color: #28a745;
        }

        .player-result-points.negative {
            color: #dc3545;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .team-header {
                flex-direction: column;
                align-items: stretch;
            }

            .team-controls {
                margin-top: 10px;
                display: flex;
                justify-content: space-between;
            }

            .player {
                flex-direction: column;
                align-items: stretch;
            }

            .player input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎳 賭けボーリング対戦</h1>

        <div class="settings">
            <div class="setting-row">
                <label>1ピンあたりのポイント:</label>
                <input type="number" id="pointPerPin" value="100" min="1">
            </div>
        </div>

        <div id="teamsContainer"></div>

        <button class="add-team-btn" onclick="addTeam()">➕ チーム追加</button>

        <div id="teamSelector" style="display: none;"></div>

        <button class="calculate-btn" id="calculateBtn" onclick="calculate()">計算する</button>

        <div id="results" style="display: none;"></div>
    </div>

    <script>
        let teams = [];
        let teamCounter = 1;
        let selectedTeams = [];

        function initializeApp() {
            addTeam();
            addTeam();
        }

        function addTeam() {
            const team = {
                id: teamCounter++,
                name: `チーム${teams.length + 1}`,
                players: [
                    { name: `プレイヤー1`, score: 0 },
                    { name: `プレイヤー2`, score: 0 }
                ]
            };
            teams.push(team);
            renderTeams();
            updateTeamSelector();
        }

        function removeTeam(teamId) {
            if (teams.length <= 2) {
                alert('最低2チーム必要です');
                return;
            }
            teams = teams.filter(t => t.id !== teamId);
            renderTeams();
            updateTeamSelector();
        }

        function addPlayer(teamId) {
            const team = teams.find(t => t.id === teamId);
            team.players.push({ name: `プレイヤー${team.players.length + 1}`, score: 0 });
            renderTeams();
        }

        function removePlayer(teamId, playerIndex) {
            const team = teams.find(t => t.id === teamId);
            if (team.players.length <= 1) {
                alert('最低1人必要です');
                return;
            }
            team.players.splice(playerIndex, 1);
            renderTeams();
        }

        function updateTeamName(teamId, newName) {
            const team = teams.find(t => t.id === teamId);
            team.name = newName;
        }

        function updatePlayerName(teamId, playerIndex, newName) {
            const team = teams.find(t => t.id === teamId);
            team.players[playerIndex].name = newName;
        }

        function updatePlayerScore(teamId, playerIndex, score) {
            const team = teams.find(t => t.id === teamId);
            team.players[playerIndex].score = parseInt(score) || 0;
        }

        function renderTeams() {
            const container = document.getElementById('teamsContainer');
            container.innerHTML = teams.map(team => `
                <div class="team">
                    <div class="team-header">
                        <input type="text" class="team-name" value="${team.name}" 
                               onchange="updateTeamName(${team.id}, this.value)">
                        <div class="team-controls">
                            <button class="add-player-btn" onclick="addPlayer(${team.id})">➕ プレイヤー追加</button>
                            ${teams.length > 2 ? `<button class="remove-team-btn" onclick="removeTeam(${team.id})">❌ チーム削除</button>` : ''}
                        </div>
                    </div>
                    ${team.players.map((player, index) => `
                        <div class="player">
                            <input type="text" class="player-name" value="${player.name}" 
                                   onchange="updatePlayerName(${team.id}, ${index}, this.value)" 
                                   placeholder="プレイヤー名">
                            <input type="number" class="player-score" value="${player.score}" 
                                   onchange="updatePlayerScore(${team.id}, ${index}, this.value)" 
                                   placeholder="スコア" min="0" max="300">
                            ${team.players.length > 1 ? `<button class="remove-player-btn" onclick="removePlayer(${team.id}, ${index})">削除</button>` : ''}
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        function updateTeamSelector() {
            const selector = document.getElementById('teamSelector');
            
            if (teams.length > 2) {
                selector.style.display = 'block';
                selector.innerHTML = `
                    <div class="team-selector">
                        <h3>対戦する2チームを選択してください</h3>
                        <div class="team-select-btns">
                            ${teams.map(team => `
                                <button class="team-select-btn" id="select-${team.id}" onclick="toggleTeamSelection(${team.id})">
                                    ${team.name}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else {
                selector.style.display = 'none';
                selectedTeams = [];
            }
        }

        function toggleTeamSelection(teamId) {
            const btn = document.getElementById(`select-${teamId}`);
            
            if (selectedTeams.includes(teamId)) {
                selectedTeams = selectedTeams.filter(id => id !== teamId);
                btn.classList.remove('selected');
            } else {
                if (selectedTeams.length >= 2) {
                    const oldTeamId = selectedTeams.shift();
                    document.getElementById(`select-${oldTeamId}`).classList.remove('selected');
                }
                selectedTeams.push(teamId);
                btn.classList.add('selected');
            }
        }

        function calculate() {
            let team1, team2;

            if (teams.length === 2) {
                team1 = teams[0];
                team2 = teams[1];
            } else {
                if (selectedTeams.length !== 2) {
                    alert('対戦する2チームを選択してください');
                    return;
                }
                team1 = teams.find(t => t.id === selectedTeams[0]);
                team2 = teams.find(t => t.id === selectedTeams[1]);
            }

            const team1Total = team1.players.reduce((sum, p) => sum + p.score, 0);
            const team2Total = team2.players.reduce((sum, p) => sum + p.score, 0);
            const scoreDiff = Math.abs(team1Total - team2Total);
            const pointPerPin = parseInt(document.getElementById('pointPerPin').value) || 100;
            const totalPoints = scoreDiff * pointPerPin;

            const winningTeam = team1Total > team2Total ? team1 : team2;
            const losingTeam = team1Total > team2Total ? team2 : team1;

            const winPointsPerPlayer = Math.round(totalPoints / winningTeam.players.length);
            const losePointsPerPlayer = Math.round(totalPoints / losingTeam.players.length);

            const resultsDiv = document.getElementById('results');
            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = `
                <div class="result-header">
                    <h2>🏆 対戦結果</h2>
                    <div class="score-diff">
                        ${winningTeam.name} の勝利！<br>
                        点数差: ${scoreDiff}ピン (${totalPoints.toLocaleString()}ポイント)
                    </div>
                </div>

                <div class="result-team">
                    <h3>🎉 ${winningTeam.name} (合計: ${team1Total > team2Total ? team1Total : team2Total}点)</h3>
                    ${winningTeam.players.map(player => `
                        <div class="result-player winner">
                            <span class="player-result-name">${player.name} (${player.score}点)</span>
                            <span class="player-result-points positive">+${winPointsPerPlayer.toLocaleString()}ポイント</span>
                        </div>
                    `).join('')}
                </div>

                <div class="result-team">
                    <h3>😢 ${losingTeam.name} (合計: ${team1Total > team2Total ? team2Total : team1Total}点)</h3>
                    ${losingTeam.players.map(player => `
                        <div class="result-player loser">
                            <span class="player-result-name">${player.name} (${player.score}点)</span>
                            <span class="player-result-points negative">-${losePointsPerPlayer.toLocaleString()}ポイント</span>
                        </div>
                    `).join('')}
                </div>
            `;

            resultsDiv.scrollIntoView({ behavior: 'smooth' });
        }

        initializeApp();
    </script>
</body>
</html>
